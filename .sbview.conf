# sbView configuration template / 設定テンプレート
# UTF-8. Uncomment only the settings you want to override.
# 変更する項目の行頭の「# 」を外してください。各例は実装の既定値です。

# Credentials / 認証情報
# Keep actual credentials outside the repository. Prefer environment variables.
# 実際の認証情報はリポジトリ外で管理し、環境変数の利用を推奨します。
# API token / APIトークン（既定は空欄）
# TOKEN=
# API secret / APIシークレット（既定は空欄）
# SECRET=
# Environment variable name for the token / トークンを格納する環境変数名
# TOKEN_ENV=
# Environment variable name for the secret / シークレットを格納する環境変数名
# SECRET_ENV=

# Retrieval / 取得
# Comma-separated categories / 取得対象をカンマ区切りで指定
# INCLUDE=Devices,Status,Scenes
# Comma-separated device IDs (empty applies no filter) / デバイスIDをカンマ区切りで指定（空欄で絞り込みなし）
# DEVICE_ID=
# API timeout in seconds (1–600) / APIタイムアウト秒数
# TIMEOUT_SEC=15
# Parallel retrieval (accepted by the parser, currently runs sequentially) / 並列取得（現行実装は逐次実行）
# PARALLEL=false
# Parallel request limit (1–64) / 並列数の上限
# THROTTLE_LIMIT=4

# Output / 出力
# Format (XML, Text, CSV) / 出力形式
# OUTPUT_FORMAT=XML
# XML mode (Structured, Raw) / XMLの出力モード
# XML_MODE=Structured
# Output file path (empty uses standard output) / 出力ファイルパス（空欄で標準出力）
# OUTPUT_PATH=
# Mask device IDs in output / 出力上のデバイスIDをマスクする
# MASK_DEVICE_ID=false
# Save raw API JSON separately / API応答のJSONを別途保存する
# SAVE_RAW_JSON=false

# Cache and logging / キャッシュとログ
# Enable cache / キャッシュを有効にする
# USE_CACHE=false
# Cache lifetime in seconds (0–86400) / キャッシュの有効期間（秒）
# CACHE_TTL=300
# Log file path (empty disables file logging) / ログファイルパス（空欄でファイルへの記録なし）
# LOG_PATH=
# Log level (Debug, Info, Warning, Error) / ログレベル
# LOG_LEVEL=Info
